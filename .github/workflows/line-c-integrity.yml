name: Line C evidence integrity
on:
  push:
    paths: ['evidence/gpt2_c*/**', 'evidence/line_c_index.json', 'scripts/*line_c*', 'scripts/numpy_writer.py', '.github/workflows/line-c-integrity.yml']
  pull_request:
    paths: ['evidence/gpt2_c*/**', 'evidence/line_c_index.json', 'scripts/*line_c*', 'scripts/numpy_writer.py', '.github/workflows/line-c-integrity.yml']
jobs:
  verify-recorded-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python scripts/verify_line_c_evidence.py --protocol-tests
